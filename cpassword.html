<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Codacs</title>
    <link rel="stylesheet" href="signin.css">
</head>
<body>
    <main class="main_container" style="max-width: 500px;">
        <section class="right" style="flex: 1;">
            <h3 class="form-title">Reset Your Password</h3>
            <form action="index.html" method="get" class="formd">
                <div class="input-group">
                    <label class="words" for="npword">New Password</label>
                    <input type="password" id="npword" name="npword" placeholder="Enter new password" required>
                </div>

                <div class="input-group">
                    <label class="words" for="cnpword">Confirm New Password</label>
                    <input type="password" id="cnpword" name="cnpword" placeholder="Confirm new password" required>
                </div>

                <button type="submit" class="signin">Update Password</button>
            </form>
        </section>
    </main>
</body>
</html>
