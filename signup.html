<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Codacs</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <main class="main_container">
        <section class="left">
            <a href="index.html" class="logo-link">
                <img src="./CA2.png" alt="Logo" height="40" class="logo">
                <span>CodeAcs</span>
            </a>
            <h2>Join Our Coding Community</h2>
            <p>Unlock practical coding skills, earn verified certificates, and build real projects.</p>
        </section>

        <section class="right">
            <form class="formd">
                <h3 class="form-title">Create Account</h3>
                <div class="input-group">
                    <label class="words" for="uname">Username</label>
                    <input type="text" id="uname" name="uname" placeholder="Choose a username" required>
                </div>
        
                <div class="input-group">
                    <label class="words" for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label class="words" for="pword">Password</label>
                    <input type="password" id="pword" name="pword" placeholder="Create a password" required>
                </div>
        
                <div class="checkbox-group">
                    <input type="checkbox" id="agree" name="agree" value="yes" required>
                    <label for="agree">I agree to the terms and conditions</label>
                </div>

                <button type="button" class="signin" onclick="window.location.href='index.html'">Sign Up</button>
                <p class="switch-link">Already have an account? <a href="signin.html">Log In</a></p>
            </form>
        </section>
    </main>
</body>
</html>
