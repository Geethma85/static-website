<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Codacs</title>
    <link rel="stylesheet" href="signin.css">
</head>
<body>
    <main class="main_container">
        <section class="left">
            <a href="index.html" class="logo-link">
                <img src="./CA2.png" alt="Logo" height="40" class="logo">
                <span>CodeAcs</span>
            </a>
            <h2>Welcome Back!</h2>
            <p>Your learning adventure is waiting right where you left off.</p>
        </section>

        <section class="right">
            <form class="formd">
                <h3 class="form-title">Log In</h3>
                <div class="input-group">
                    <label class="words" for="uname">Username</label>
                    <input type="text" id="uname" name="uname" placeholder="Enter username" required>
                </div>
        
                <div class="input-group">
                    <label class="words" for="pword">Password</label>
                    <input type="password" id="pword" name="pword" placeholder="Enter password" required>
                </div>
        
                <button type="button" class="signin" onclick="window.location.href='index.html'">Log In</button>
                <p class="switch-link">Don't have an account? <a href="signup.html">Sign Up</a></p>
            </form>
        </section>
    </main>
</body>
</html>
